<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX</title>
    <link rel="stylesheet" href="start.css">
</head>
<body>
    <h1 id="topic"></h1>
    <p id="explain"></p>
    <p id="p1"></p>
    <p id="p2"></p>
    <p id="p3"></p>
    <label>COLLEGE NAME</label>
    <input type="text" id="clg">
    <button type="submit" id="submit">Submit</button>
    <h1>Counter Program</h1>
    <label id="countlabel">0</label><br>
    <div id="buttondiv">
        <button id="inc">Increase</button>
        <button id="dec">Decrease</button>
        <button id="res">Reset</button>
    </div>
    <p>GPA and grade</p>
    <label>GPA</label><br>
    <input type="number" id="gpa"><br><br>
    <input type="submit" id="gpasubmit">
    <p>
        The grade for your GPA is <pre id="gradeshow">NA</pre>
    </p>
    <p>Your academic status:</p>
    <input type="checkbox" id="enroll">
    <label for="enroll">Enrolled in KEC</label><br>
    <label>Choose your faculty</label>
    <br>
    <input type="radio" id="bct" name="myfaculty">
    <label for="bct">Computer</label>
    <input type="radio" id="bce" name="myfaculty">
    <label for="bce">Civil</label>
    <input type="radio" id="bar" name="myfaculty">
    <label for="bar">Architecture</label>
    <input type="radio" id="bel" name="myfaculty">
    <label for="bel">Electrical</label>
    <input type="radio" id="bei" name="myfaculty">
    <label for="bei">Electronics</label><br>
    <button type="submit" id="acstatus">Submit</button>
    <p id="enrollres"></p>
    <p id="facultyres"></p>
    <p id="username">Username</p>
    <script src="start.js"></script>
</body>
</html>
